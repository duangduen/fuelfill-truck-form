<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ระบบบันทึกการเติมน้ำมันจากรถน้ำมัน</title>
<!--
  LIFF frontend ไฟล์เดียว — host บน GitHub Pages (แบบเดียวกับระบบขอย้ายเครื่องจักร)
  เรียก Apps Script Web App ผ่าน JSONP (อ่าน+เขียน) / hidden-iframe form POST (เฉพาะ submitFill ที่มีรูปใหญ่)
  ดูเหตุผลทางเทคนิคในคอมเมนต์หัวไฟล์ Code.gs
-->
<style>
  :root {
    --c-primary: #0a6e3c;   /* เขียวน้ำมัน */
    --c-primary-dark: #08562f;
    --c-accent: #f39c12;
    --c-danger: #c0392b;
    --c-bg: #f2f4f3;
    --c-card: #ffffff;
    --c-text: #1c2b24;
    --c-muted: #6b7a72;
    --c-border: #dde4e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Thai', 'Sarabun', sans-serif;
    background: var(--c-bg); color: var(--c-text); font-size: 16px; padding-bottom: 90px;
  }
  header {
    background: var(--c-primary); color: #fff; padding: 12px 16px;
    position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .who { font-size: 12px; opacity: .9; text-align: right; }
  .banner-test { background: #b03a2e; color: #fff; text-align: center; padding: 6px; font-size: 13px; }
  .banner-stale { background: #f39c12; color: #fff; text-align: center; padding: 6px; font-size: 13px; }
  main { padding: 12px; max-width: 860px; margin: 0 auto; }
  .card {
    background: var(--c-card); border: 1px solid var(--c-border); border-radius: 12px;
    padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card h3 { font-size: 15px; margin-bottom: 8px; }
  .row { font-size: 14px; margin: 3px 0; color: var(--c-text); }
  .row b { font-weight: 600; }
  .muted { color: var(--c-muted); font-size: 13px; }
  .status-chip {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
    background: #e8f2ec; color: var(--c-primary-dark); font-weight: 600;
  }
  .status-chip.warn { background: #fdf0dc; color: #9a6a08; }
  .status-chip.danger { background: #fbe4e0; color: var(--c-danger); }
  .flag { display:inline-block; background:#fbe4e0; color:var(--c-danger); border-radius:6px; padding:1px 8px; font-size:12px; margin:2px 4px 2px 0; }
  button {
    font-family: inherit; font-size: 15px; border: none; border-radius: 10px;
    padding: 12px 16px; cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: var(--c-primary); color: #fff; width: 100%; margin-top: 10px; }
  .btn-primary:active { background: var(--c-primary-dark); }
  .btn-secondary { background: #e8ede9; color: var(--c-text); width: 100%; margin-top: 8px; }
  .btn-danger { background: #fbe4e0; color: var(--c-danger); width: 100%; margin-top: 8px; }
  .btn-small { padding: 8px 12px; font-size: 13px; width: auto; margin: 4px 4px 0 0; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: var(--c-text); }
  label .opt { font-weight: 400; color: var(--c-muted); }
  input, select, textarea {
    width: 100%; font-family: inherit; font-size: 16px; padding: 11px 12px;
    border: 1px solid var(--c-border); border-radius: 10px; background: #fff;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--c-primary); border-color: transparent; }
  input[readonly] { background: #eef1ef; color: var(--c-muted); }
  .hint { font-size: 12px; color: var(--c-muted); margin-top: 3px; }
  .hint.error { color: var(--c-danger); font-weight: 600; }
  /* ---- searchable dropdown (ใช้แทน select/datalist ทุกช่องในระบบ) ---- */
  .combo-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #fff; border: 1px solid var(--c-border); border-radius: 10px;
    padding: 11px 12px; font-size: 16px; font-weight: 400; line-height: 1.2;
    color: var(--c-text); text-align: left;
  }
  .combo-btn:active { background: #f4f7f5; }
  .combo-btn.noval .combo-text { color: #9aa8a0; }
  .combo-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo-caret { color: var(--c-muted); font-size: 12px; }
  .combo-modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; display: flex; align-items: flex-end; }
  .combo-sheet { background: #fff; width: 100%; max-height: 84vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .combo-head { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--c-border); }
  .combo-head input { flex: 1; }
  .combo-close { background: #e8ede9; color: var(--c-text); padding: 11px 14px; font-size: 14px; }
  .combo-title { font-size: 12px; color: var(--c-muted); padding: 8px 16px 0; }
  .combo-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 0 16px; }
  .combo-item { padding: 12px 16px; border-bottom: 1px solid #f0f3f1; font-size: 15px; cursor: pointer; }
  .combo-item:active { background: #e8f2ec; }
  .combo-item .sub { display: block; font-size: 12px; color: var(--c-muted); margin-top: 2px; }
  .combo-item.sel { background: #e8f2ec; font-weight: 700; }
  .combo-item.free { color: var(--c-primary-dark); font-weight: 600; }
  .combo-empty { padding: 22px 16px; text-align: center; color: var(--c-muted); font-size: 13px; }
  @media (min-width: 600px) {
    .combo-modal { align-items: center; justify-content: center; }
    .combo-sheet { max-width: 520px; max-height: 76vh; border-radius: 14px; }
  }
  .calcbox { background:#e8f2ec; border-radius:10px; padding:10px 12px; margin-top:10px; font-size:14px; }
  .calcbox .big { font-size:18px; font-weight:700; }
  .calcbox .neg { color: var(--c-danger); }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid var(--c-border); display: flex; z-index: 50;
  }
  nav button {
    flex: 1; background: none; border-radius: 0; padding: 8px 2px 10px; font-size: 11px;
    color: var(--c-muted); font-weight: 500; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  nav button .ico { font-size: 20px; }
  nav button.active { color: var(--c-primary); font-weight: 700; }
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(28,43,36,.95); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; z-index: 99; display: none; max-width: 90%; text-align: center;
  }
  .spinner {
    display: none; position: fixed; inset: 0; background: rgba(255,255,255,.6);
    z-index: 98; align-items: center; justify-content: center;
  }
  .spinner div {
    width: 42px; height: 42px; border: 4px solid var(--c-border); border-top-color: var(--c-primary);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--c-border); padding: 7px 6px; text-align: left; vertical-align: top; }
  th { background: #eef3f0; font-weight: 600; white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  .photo-preview { max-width: 130px; border-radius: 8px; margin-top: 6px; display: block; }
  .tabbar { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tabbar button { background:#e8ede9; color:var(--c-text); padding:8px 14px; font-size:13px; border-radius:999px; }
  .tabbar button.active { background:var(--c-primary); color:#fff; }
  .empty { text-align:center; color:var(--c-muted); padding:28px 10px; font-size:14px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  @media (max-width:480px){ .grid2{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="banner-test" class="banner-test" style="display:none">⚠️ โหมดทดสอบ — แจ้งเตือนทั้งหมดส่งเข้าแชทผู้ดูแลระบบ</div>
<div id="banner-stale" class="banner-stale" style="display:none">⚠️ ข้อมูลทะเบียนเครื่องจักร/หน้างานยังไม่ได้ sync เกิน 48 ชม. — แจ้งผู้ดูแลตรวจสคริปต์เซิร์ฟเวอร์</div>

<header>
  <h1>⛽ บันทึกการเติมน้ำมัน</h1>
  <div class="who" id="who"></div>
</header>

<main id="main"><div class="empty">กำลังโหลด…</div></main>

<nav id="nav" style="display:none"></nav>
<div class="combo-modal" id="combo-modal" style="display:none">
  <div class="combo-sheet">
    <div class="combo-head">
      <input id="combo-search" placeholder="พิมพ์ค้นหา…" autocomplete="off" oninput="comboRenderList()">
      <button type="button" class="combo-close" onclick="comboClose()">ปิด</button>
    </div>
    <div class="combo-title" id="combo-title"></div>
    <div class="combo-list" id="combo-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="spinner" id="spinner"><div></div></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ================================ ค่าตั้งต้น ================================ */
// TODO: ใส่ค่าจริงหลัง deploy (ดู README-setup.md)
var LIFF_ID = '2010592933-spMS7dWC';
var API_URL = 'https://script.google.com/macros/s/AKfycbzShJ2KgmFbjA64tk7KqoNFkSMC4pcq8btuiPuKx6v6k1luNs7ILVR1UFIpt0G3iE1_/exec';
// เปิดทดสอบบนเบราว์เซอร์ปกติโดยไม่ผ่าน LINE: ?dev=LINE_USER_ID_ที่ลงทะเบียนไว้
var DEV_USER_ID = new URLSearchParams(location.search).get('dev');

// ค่าเริ่มต้นของฟอร์ม (แก้ตรงนี้ที่เดียวถ้าธุรกิจเปลี่ยน)
var DEFAULT_FUEL_CODE = '12';         // ดีเซล B-20 — เกรดที่ใช้จริงเกือบทั้งหมด
var DEFAULT_PO_LOCATION_CODE = '10401'; // สถานที่รับน้ำมันที่ใช้บ่อยที่สุด (fuel_po_location.code)

var CURRENT_USER = null; // {userId, name, roles:[...], defaultTank}
var MASTERS = { machines: [], sites: [], fuels: [], tanks: [], poLocations: [], receivers: [] };
var ROLES = { DRIVER: 'คนขับรถน้ำมัน', CLERK1: 'เสมียน1', CLERK2: 'เสมียน2',
  STATION_CLERK1: 'เสมียนปั๊ม1', STATION_CLERK2: 'เสมียนปั๊ม2', ADMIN: 'ผู้ดูแล' };

/* ================================ JSONP / POST bridge (pattern ระบบขอย้ายฯ) ================================ */
var jsonpCounter = 0;
function jsonpRequest(qs) {
  return new Promise(function (resolve, reject) {
    var cbName = '__jsonp_cb_' + (++jsonpCounter) + '_' + Date.now();
    var script = document.createElement('script');
    var timer = setTimeout(function () { cleanup(); reject(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (หมดเวลา)')); }, 45000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function (result) { cleanup(); resolve(result); };
    script.onerror = function () { cleanup(); reject(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้')); };
    script.src = API_URL + '?' + qs + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}
function formPostRequest(fields) {
  return new Promise(function (resolve, reject) {
    var iframeName = '__post_frame_' + Date.now();
    var iframe = document.createElement('iframe');
    iframe.name = iframeName; iframe.style.display = 'none';
    var form = document.createElement('form');
    form.method = 'POST'; form.action = API_URL; form.target = iframeName; form.style.display = 'none';
    fields.viaForm = '1';
    Object.keys(fields).forEach(function (k) {
      var input = document.createElement('input');
      input.type = 'hidden'; input.name = k;
      input.value = fields[k] == null ? '' : fields[k];
      form.appendChild(input);
    });
    var timer = setTimeout(function () { cleanup(); reject(new Error('ส่งข้อมูลไม่สำเร็จ (หมดเวลา) — ลองใหม่ หรือเช็คในประวัติว่าบันทึกไปแล้วหรือยัง')); }, 60000);
    function onMsg(ev) {
      if (!ev.data || typeof ev.data.ok === 'undefined') return;
      cleanup(); resolve(ev.data);
    }
    function cleanup() {
      clearTimeout(timer);
      window.removeEventListener('message', onMsg);
      setTimeout(function () {
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        if (form.parentNode) form.parentNode.removeChild(form);
      }, 500);
    }
    window.addEventListener('message', onMsg);
    document.body.appendChild(iframe);
    document.body.appendChild(form);
    form.submit();
  });
}

var GET_ACTION_ARGS = {
  whoAmI: ['userId'],
  machineList: [], siteList: [], fuelList: [], tankList: [], poLocationList: [], receiverList: [],
  lastRemaining: ['tank'],
  myOrders: ['userId'], myOrderHistory: ['userId'],
  pendingIssue: ['userId'], activeOrders: ['userId'], orderHistory: ['userId'],
  fillsOfOrder: ['userId', 'orderId'],
  pendingReview: ['userId'], importedPendingAudit: ['userId'], importFailed: ['userId'],
  dashboard: ['userId'],
  requestOrder: ['userId', 'payload'],
  cancelOrder: ['userId', 'orderId', 'reason'],
  issueOrder: ['userId', 'orderId', 'patch'],
  cancelFill: ['userId', 'fillId', 'reason'],
  editFill: ['userId', 'fillId', 'patch'],
  submitEndOfDay: ['userId', 'orderId', 'payload'],
  approveDailyReport: ['userId', 'orderId'],
  rejectDailyReport: ['userId', 'orderId', 'reason'],
  auditFills: ['userId', 'fillIds'],
  retryImport: ['userId', 'fillId'],
  // ใบเสร็จรับน้ำมันจากปั๊ม
  receiptsOfOrder: ['userId', 'orderId'],
  cancelReceipt: ['userId', 'receiptId', 'reason'],
  stationPending: ['userId'], verifyReceipt: ['userId', 'receiptId', 'patch'],
  stationDaily: ['userId', 'date'], sendStationDaily: ['userId', 'date'], stationHistory: ['userId'],
  apPending: ['userId'], markApRecorded: ['userId', 'receiptIds', 'apDocNo'], apMonthly: ['userId', 'yyyymm']
};
// submitFill มีรูปแนบ — ลอง JSONP ก่อนถ้าสั้นพอ ไม่งั้น hidden-iframe form (pattern markMoved เดิม)
var POST_ACTION_ARGS = {
  submitFill: ['userId', 'payload', 'photo'],
  addReceipt: ['userId', 'orderId', 'payload', 'photo'] // รูปใบเสร็จปั๊ม 1 ใบต่อครั้ง
};
GET_ACTION_ARGS.recordLoad = ['userId', 'orderId', 'payload'];

function callServer(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  function buildQs(keys) {
    var qs = 'action=' + fnName;
    keys.forEach(function (k, i) {
      var v = args[i];
      if (v != null && typeof v === 'object') v = JSON.stringify(v);
      qs += '&' + k + '=' + encodeURIComponent(v == null ? '' : v);
    });
    return qs;
  }
  function unwrap(result) {
    if (!result.ok) throw new Error(result.error || 'เกิดข้อผิดพลาดไม่ทราบสาเหตุ');
    return result.data;
  }
  if (GET_ACTION_ARGS.hasOwnProperty(fnName)) {
    return jsonpRequest(buildQs(GET_ACTION_ARGS[fnName])).then(unwrap);
  }
  if (POST_ACTION_ARGS.hasOwnProperty(fnName)) {
    var keys = POST_ACTION_ARGS[fnName];
    var qs = buildQs(keys);
    if (qs.length < 6000) return jsonpRequest(qs).then(unwrap);
    var fields = { action: fnName };
    keys.forEach(function (k, i) {
      var v = args[i];
      if (v != null && typeof v === 'object') v = JSON.stringify(v);
      fields[k] = v == null ? '' : v;
    });
    return formPostRequest(fields).then(unwrap);
  }
  return Promise.reject(new Error('ไม่รู้จักฟังก์ชัน: ' + fnName));
}

/* ================================ UI helpers ================================ */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ======================= searchable dropdown (ใช้แทน select/datalist ทั้งระบบ) =======================
   ทำไมไม่ใช้ของเดิม: <select> ที่มีเครื่องจักร 400+ คันเลื่อนหาบนมือถือลำบากมาก ส่วน <datalist>
   เบราว์เซอร์ในแอป LINE (โดยเฉพาะ iOS) แสดงผลไม่สม่ำเสมอ — ตัวนี้เป็น bottom sheet + ช่องค้นหา
   เขียนเอง ไม่พึ่ง library ภายนอก (โหลด CDN ในแอป LINE ไม่แน่นอน)
   ค่าที่เลือกถูกเก็บใน <input type="hidden"> ที่ "id เดิม" ทุกช่อง โค้ดส่วนอื่นจึงอ่าน
   $('f-xxx').value ได้เหมือนเดิมทุกจุด ไม่ต้องแก้ตรรกะการส่งข้อมูล */
var COMBOS = {};          // id -> cfg
var COMBO_ACTIVE = null;  // id ของช่องที่เปิด sheet อยู่

/**
 * คืน HTML ของช่องเลือกแบบค้นหาได้ พร้อมลงทะเบียนรายการไว้ใช้ตอนเปิด sheet
 * cfg = { id, items:[{v,label,sub}], value, placeholder, title, allowFree, clearable, onChange }
 *   allowFree : ให้ใช้ข้อความที่พิมพ์เองได้ (เช่นชื่อผู้รับน้ำมันที่ไม่มีใน drv_mst)
 *   clearable : มีตัวเลือก "ไม่ระบุ" (ล้างค่า)
 *   onChange  : ฟังก์ชันที่เรียกหลังเลือก (เช่น machineHint)
 */
function comboField(cfg) {
  cfg.items = cfg.items || [];
  COMBOS[cfg.id] = cfg;
  var v = cfg.value == null ? '' : String(cfg.value);
  return '<div class="combo">' +
    '<input type="hidden" id="' + cfg.id + '" value="' + esc(v) + '">' +
    '<button type="button" class="combo-btn' + (v ? '' : ' noval') + '" id="cbbtn-' + cfg.id + '"' +
    ' onclick="comboOpen(\'' + cfg.id + '\')">' +
    '<span class="combo-text">' + esc(comboLabel_(cfg, v) || cfg.placeholder || 'แตะเพื่อเลือก') + '</span>' +
    '<span class="combo-caret">▼</span></button></div>';
}
/** ป้ายที่แสดงบนปุ่ม — ค่าที่ไม่มีในทะเบียน (ข้อความอิสระ/รหัสเก่าที่ถูกปิดใช้) แสดงตามค่าที่เก็บไว้ */
function comboLabel_(cfg, v) {
  if (!v) return '';
  var hit = cfg.items.filter(function (it) { return String(it.v) === String(v); })[0];
  return hit ? hit.label : v;
}
function comboSetValue(id, v) {
  var cfg = COMBOS[id]; if (!cfg) return;
  var el = $(id); if (el) el.value = v == null ? '' : v;
  var btn = $('cbbtn-' + id);
  if (btn) {
    btn.className = 'combo-btn' + (v ? '' : ' noval');
    btn.getElementsByClassName('combo-text')[0].textContent =
      comboLabel_(cfg, v) || cfg.placeholder || 'แตะเพื่อเลือก';
  }
}
function comboOpen(id) {
  var cfg = COMBOS[id]; if (!cfg) return;
  COMBO_ACTIVE = id;
  $('combo-title').textContent = cfg.title || '';
  $('combo-search').value = '';
  $('combo-search').placeholder = cfg.searchPlaceholder || 'พิมพ์ค้นหา…';
  $('combo-modal').style.display = 'flex';
  comboRenderList();
  setTimeout(function () { try { $('combo-search').focus(); } catch (e) {} }, 80);
}
function comboClose() {
  $('combo-modal').style.display = 'none';
  COMBO_ACTIVE = null;
}
function comboRenderList() {
  var cfg = COMBOS[COMBO_ACTIVE]; if (!cfg) return;
  var raw = $('combo-search').value.trim();
  var terms = raw ? raw.toLowerCase().split(/\s+/) : [];
  var cur = ($(cfg.id) || {}).value || '';
  var hits = cfg.items.filter(function (it) {
    if (!terms.length) return true;
    var hay = (String(it.v) + ' ' + String(it.label) + ' ' + String(it.sub || '')).toLowerCase();
    return terms.every(function (t) { return hay.indexOf(t) !== -1; }); // ค้นได้ทั้งรหัสและชื่อ หลายคำ
  });
  var shown = hits.slice(0, 200); // กันค้างตอนรายการยาว (เครื่องจักร 400+) — พิมพ์เพิ่มเพื่อแคบลง
  var html = '';
  if (cfg.clearable) html += '<div class="combo-item" data-v="">— ไม่ระบุ —</div>';
  if (cfg.allowFree && raw) {
    html += '<div class="combo-item free" data-v="' + esc(raw) + '">✍️ ใช้ข้อความที่พิมพ์: “' + esc(raw) + '”</div>';
  }
  html += shown.map(function (it) {
    return '<div class="combo-item' + (String(it.v) === String(cur) ? ' sel' : '') + '" data-v="' + esc(it.v) + '">' +
      esc(it.label) + (it.sub ? '<span class="sub">' + esc(it.sub) + '</span>' : '') + '</div>';
  }).join('');
  if (!shown.length && !cfg.allowFree) {
    html += '<div class="combo-empty">ไม่พบรายการที่ตรงกับ “' + esc(raw) + '”</div>';
  }
  if (hits.length > shown.length) {
    html += '<div class="combo-empty">แสดง ' + shown.length + ' จาก ' + hits.length + ' รายการ — พิมพ์เพิ่มเพื่อค้นหาให้แคบลง</div>';
  }
  $('combo-list').innerHTML = html;
  $('combo-list').scrollTop = 0;
}
function comboPick_(v) {
  var id = COMBO_ACTIVE; if (!id) return;
  var cfg = COMBOS[id];
  comboSetValue(id, v);
  comboClose();
  if (cfg && typeof cfg.onChange === 'function') cfg.onChange(v);
}
/** ผูก event ครั้งเดียวตอนเริ่มระบบ (ใช้ delegation เพราะรายการถูก render ใหม่ทุกครั้งที่พิมพ์) */
function comboInit_() {
  $('combo-list').addEventListener('click', function (ev) {
    var el = ev.target;
    while (el && el !== this && !(el.className && String(el.className).indexOf('combo-item') !== -1)) el = el.parentNode;
    if (!el || el === this) return;
    comboPick_(el.getAttribute('data-v'));
  });
  $('combo-modal').addEventListener('click', function (ev) { if (ev.target === this) comboClose(); });
}
/** ค่าเริ่มต้นชนิดน้ำมันของทุกใบคำขอ = ดีเซล B-20 (fuelcode 12) — ถ้าไม่มีในทะเบียนค่อยใช้รายการแรก */
function defaultFuelValue() {
  var list = MASTERS.fuels || [];
  var hit = list.filter(function (f) { return String(f.code).trim() === DEFAULT_FUEL_CODE; })[0] ||
    list.filter(function (f) { return /b\s*-?\s*20/i.test(String(f.name)); })[0] ||
    list[0];
  return hit ? hit.code + ' - ' + hit.name : '';
}
/** รายการสถานที่รับน้ำมัน (ปั๊ม/คลัง) สำหรับ combo ของเสมียน 1 */
function poLocationComboItems() {

function defaultPoLocationValue() {

/** แปลง MASTERS.fuels เป็นรายการของ combo (value คงรูปแบบเดิม "code - name" ที่ฝั่ง server ใช้อยู่) */

function showToast(msg) {

/* ================================ init ================================ */
function init() {
  var boot;
  if (DEV_USER_ID) {
    boot = Promise.resolve(DEV_USER_ID);
  } else {
    boot = liff.init({ liffId: LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login(); return new Promise(function () {}); }
      return liff.getProfile().then(function (p) { return p.userId; });
    });
  }
  boot.then(function (userId) {
    return callServer('whoAmI', userId).then(function (me) {
      if (me.testMode) $('banner-test').style.display = 'block';
      if (!me.registered) { renderNotRegistered(userId); return; }
      if (!me.active) {
        $('main').innerHTML = '<div class="card"><h3>บัญชีถูกปิดใช้งาน</h3><div class="muted">กรุณาติดต่อเสมียน 1 หรือผู้ดูแลระบบ</div></div>';
        return;
      }
      CURRENT_USER = { userId: userId, name: me.name, roles: me.roles, defaultTank: me.defaultTank || '' };
      $('who').innerHTML = esc(me.name) + '<br>' + esc(me.roles.join(', '));
      buildNav();
      loadMasters();
      navigate(defaultView());
    });
  }).catch(function (err) {
    $('main').innerHTML = '<div class="card"><h3>เข้าระบบไม่ได้</h3><div class="muted">' + esc(err.message) + '</div>' +
      '<button class="btn-secondary" onclick="location.reload()">ลองใหม่</button></div>';
  });
}

function renderNotRegistered(userId) {
  $('main').innerHTML =
    '<div class="card"><h3>ยังไม่ได้ลงทะเบียนผู้ใช้งาน</h3>' +
    '<div class="row">ส่งรหัสด้านล่างให้เสมียน 1 เพื่อเพิ่มสิทธิ์ในแท็บ "สิทธิ์ผู้ใช้งาน"</div>' +
    '<input readonly value="' + esc(userId) + '" id="reg-id" style="margin-top:8px">' +
    '<button class="btn-primary" onclick="copyRegId()">📋 คัดลอกรหัส</button></div>';
}
function copyRegId() {
  var v = $('reg-id').value;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(v).then(function () { showToast('คัดลอกแล้ว'); });
  } else { $('reg-id').select(); document.execCommand('copy'); showToast('คัดลอกแล้ว'); }
}

function hasRole(r) { return CURRENT_USER && (CURRENT_USER.roles.indexOf(r) !== -1 || CURRENT_USER.roles.indexOf(ROLES.ADMIN) !== -1); }
function defaultView() {
  if (hasRole(ROLES.DRIVER)) return 'driver';
  if (hasRole(ROLES.CLERK1)) return 'clerk1';
  if (hasRole(ROLES.CLERK2)) return 'clerk2';
  if (hasRole(ROLES.STATION_CLERK1)) return 'station';
  if (hasRole(ROLES.STATION_CLERK2)) return 'ap';
  return 'dashboard';
}
function buildNav() {
  var items = [];
  if (hasRole(ROLES.DRIVER)) items.push({ id: 'driver', ico: '🚛', label: 'งานของฉัน' });
  if (hasRole(ROLES.CLERK1)) items.push({ id: 'clerk1', ico: '🧾', label: 'เสมียน 1' });
  if (hasRole(ROLES.CLERK2)) items.push({ id: 'clerk2', ico: '🔍', label: 'เสมียน 2' });
  if (hasRole(ROLES.STATION_CLERK1)) items.push({ id: 'station', ico: '⛽', label: 'ปั๊ม' });
  if (hasRole(ROLES.STATION_CLERK2)) items.push({ id: 'ap', ico: '🏢', label: 'fuel_ap' });
  items.push({ id: 'dashboard', ico: '📊', label: 'ภาพรวม' });
  var nav = $('nav');
  nav.innerHTML = items.map(function (it) {
    return '<button id="nav-' + it.id + '" onclick="navigate(\'' + it.id + '\')"><span class="ico">' + it.ico + '</span>' + it.label + '</button>';
  }).join('');
  nav.style.display = 'flex';
}
function navigate(view) {
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.remove('active'); });
  var btn = $('nav-' + view);
  if (btn) btn.classList.add('active');
  if (view === 'driver') renderDriverHome();
  else if (view === 'clerk1') renderClerk1();
  else if (view === 'clerk2') renderClerk2();
  else if (view === 'station') renderStation();
  else if (view === 'ap') renderAp();
  else renderDashboard();
}

/* ---- รายการหน้างานสำหรับ dropdown (ใช้ร่วมทุกหน้าจอ) ----
   แสดงเฉพาะ "ชื่อหน้างาน" ไม่มีรหัสนำหน้า และเรียงตามตัวอักษร (ผู้ใช้ขอ 3 ก.ย. 2569)
   รหัสยังค้นหาได้อยู่ เพราะ comboRenderList() ค้นจาก it.v ด้วย และโชว์รหัสไว้บรรทัดล่างเป็นตัวจาง */
function thaiCmp_(a, b) {
  a = String(a || ''); b = String(b || '');
  try { return a.localeCompare(b, 'th'); } catch (e) { return a < b ? -1 : (a > b ? 1 : 0); }
}
function siteItems_() {
  return MASTERS.sites.map(function (s) {
    var sub = 'รหัส ' + s.code + (s.projectid ? ' · โครงการ ' + s.projectid : '');
    return { v: s.code, label: s.name || s.code, sub: sub };
  }).sort(function (x, y) { return thaiCmp_(x.label, y.label); });
}

function loadMasters() {
  Object.keys(MASTER_LOADERS).forEach(function (k) { loadMaster_(k).catch(function () {}); });
}
function loadMaster_(key) {
  return callServer(MASTER_LOADERS[key].action).then(function (d) {
    MASTERS[key] = d.items || [];
    if (key === 'machines' && d.stale) $('banner-stale').style.display = 'block';
    return MASTERS[key];
  });
}
/**
 * โหลด master ที่หน้าจอนั้นต้องใช้ให้ครบ "ก่อน" render
 * กันเคสที่ loadMasters() ตอนเข้าระบบยังโหลดไม่เสร็จ หรือล้มเหลวไปเงียบ ๆ
 * แล้วฟอร์มถูก render ด้วยรายการว่าง (ค่าเริ่มต้นอย่างรถประจำจะหายไปโดยไม่มีใครรู้)
 */
function ensureMasters(keys) {
  var missing = keys.filter(function (k) { return !(MASTERS[k] && MASTERS[k].length); });
  if (!missing.length) return Promise.resolve();
  busy(true);
  return Promise.all(missing.map(loadMaster_)).then(function () {
    busy(false);
  }, function (err) {
    busy(false);
    throw new Error('โหลดทะเบียนข้อมูลไม่สำเร็จ (' + missing.map(function (k) { return MASTER_LOADERS[k].label; }).join(', ') + ') — ' + err.message);
  });
}

/**
 * หา "รถประจำ" ของคนขับจากค่าในแท็บสิทธิ์ผู้ใช้งาน (คอลัมน์ รถน้ำมันประจำ)
 * รองรับได้ทั้งกรอกเป็นรหัสล้วน (403), ข้อความเต็ม (403 - รถน้ำมัน 83-0551),
 * ชื่อ/ทะเบียนอย่างเดียว (83-0551) และกรณีมีช่องว่างหน้า-หลังติดมา
 */
function findDefaultTank_(items, def) {
  var d = String(def == null ? '' : def).trim().toLowerCase();
  if (!d) return '';
  function n(s) { return String(s == null ? '' : s).trim().toLowerCase(); }
  var hit =
    items.filter(function (it) { return n(it.v) === d; })[0] ||                      // ตรงเป๊ะทั้งข้อความ
    items.filter(function (it) { return it.code && n(it.code) === d; })[0] ||        // ตรงรหัสรถ
    items.filter(function (it) { return n(it.v).indexOf(d) !== -1; })[0] ||          // ข้อความในทะเบียนมีคำนี้
    items.filter(function (it) {                                                    // โปรไฟล์เก็บข้อความยาวกว่า
      return it.code && d.split(/[^0-9a-zA-Zก-๙\-]+/).indexOf(n(it.code)) !== -1;
    })[0];
  return hit ? hit.v : '';
}
function renderRequestOrderForm() {

  });
  var defTank = findDefaultTank_(tankItems, CURRENT_USER.defaultTank);

  else if (!tankItems.length) tankHint = '⚠️ ยังโหลดทะเบียนรถน้ำมันไม่ได้ — ลองโหลดหน้าใหม่';

  else tankHint = 'ยังไม่ได้ตั้งรถประจำในแท็บสิทธิ์ผู้ใช้งาน — เลือกเองทุกครั้ง';
  $('main').innerHTML =

function doRequestOrder() {

/*

var LOAD_ORDER = null; // ใบสั่งที่กำลังเปิดหน้ารับน้ำมัน

      '<div><label>เลขที่ใบเสร็จ <span class="opt">(ไม่บังคับ)</span></label><input id="rc-no" placeholder="ตามหัวใบเสร็จ"></div>' +

var RECEIPT_TOTAL = 0, RECEIPT_COUNT = 0;
function renderReceiptList(d) {
  RECEIPT_TOTAL = d.total || 0; RECEIPT_COUNT = d.count || 0;
  var issued = num(LOAD_ORDER && LOAD_ORDER['จำนวนลิตรที่สั่งจ่าย']);
  var rows = (d.receipts || []).filter(function (r) { return r['สถานะรายการ'] !== 'ยกเลิก'; });
  var html = '';
  if (!rows.length) {
    html += '<div class="empty" style="padding:14px">ยังไม่มีใบเสร็จ — กด "เพิ่มใบเสร็จ" ทันทีที่เด็กปั๊มยื่นให้ทีละใบ</div>';
  } else {
    html += '<div class="tablewrap"><table><tr><th>#</th><th>ลิตร</th><th>เลขที่</th><th>สถานะ</th><th></th></tr>' +
      rows.map(function (r, i) {
        var chk = r['สถานะปั๊มตรวจ'];
        var chip = chk === 'ปั๊มตรวจแล้ว' ? '<span class="status-chip">ปั๊มตรวจแล้ว</span>'
          : chk === 'ไม่ตรง' ? '<span class="status-chip danger">ไม่ตรง</span>' : '<span class="status-chip warn">รอปั๊มตรวจ</span>';
        var canDel = chk !== 'ปั๊มตรวจแล้ว';
        return '<tr><td>' + (i + 1) + (r['รูปใบเสร็จ'] ? ' <a href="' + esc(r['รูปใบเสร็จ']) + '" target="_blank">📷</a>' : '') + '</td>' +
          '<td style="text-align:right"><b>' + esc(r['จำนวนลิตร']) + '</b></td><td>' + esc(r['เลขที่ใบเสร็จ'] || '-') + '</td><td>' + chip + '</td>' +
          '<td>' + (canDel ? '<button class="btn-danger btn-small" onclick="doCancelReceipt(\'' + esc(r['Receipt ID']) + '\')">ลบ</button>' : '') + '</td></tr>';
      }).join('') + '</table></div>';
  }
  html += '<div class="calcbox">รวม <span class="big">' + RECEIPT_COUNT + ' ใบ = ' + RECEIPT_TOTAL + ' ล.</span>' +
    (issued != null ? ' / สั่งจ่าย ' + issued + ' ล.' +
      (Math.abs(RECEIPT_TOTAL - issued) > 0.5 && RECEIPT_COUNT ? '<br><span class="' + (RECEIPT_TOTAL < issued ? 'neg' : '') + '">' +
        (RECEIPT_TOTAL < issued ? 'ยังขาดอีก ' + Math.round((issued - RECEIPT_TOTAL) * 100) / 100 + ' ล. — มีใบเสร็จอีกไหม?' : 'เกินยอดสั่งจ่าย ' + Math.round((RECEIPT_TOTAL - issued) * 100) / 100 + ' ล.') + '</span>' : '') : '') + '</div>';
  $('receipt-list').innerHTML = html;
  var manual = $('manual-received');
  if (manual) manual.style.display = RECEIPT_COUNT ? 'none' : 'block';
  calcLoad();
}
function toggleReceiptAdd(show) {
  $('receipt-add').style.display = show ? 'block' : 'none';
  $('btn-add-receipt').style.display = show ? 'none' : 'block';
  if (show) { $('rc-liters').value = ''; $('rc-no').value = ''; $('rc-photo').value = ''; $('receipt-preview').style.display = 'none'; }
}
function previewReceipt() {
  var f = $('rc-photo').files[0];
  var img = $('receipt-preview');
  if (!f) { img.style.display = 'none'; return; }
  img.src = URL.createObjectURL(f);
  img.style.display = 'block';
}
function doAddReceipt(orderId) {
  var liters = num($('rc-liters').value);
  if (liters == null || liters <= 0) { showToast('กรอกจำนวนลิตรในใบเสร็จก่อน'); return; }
  if (!$('rc-photo').files[0]) { showToast('ถ่ายรูปใบเสร็จก่อน — ปั๊มต้องใช้เทียบสำเนา'); return; }
  busy(true);
  compressPhoto($('rc-photo').files[0]).then(function (photo) {
    if (!photo) throw new Error('อ่านรูปไม่ได้ ลองถ่ายใหม่');
    return callServer('addReceipt', CURRENT_USER.userId, orderId, { liters: liters, receiptNo: $('rc-no').value.trim() }, photo);
  }).then(function () {
    return callServer('receiptsOfOrder', CURRENT_USER.userId, orderId);
  }).then(function (d) {
    busy(false);
    toggleReceiptAdd(false);
    renderReceiptList(d);
    showToast('บันทึกใบเสร็จแล้ว รวม ' + d.count + ' ใบ = ' + d.total + ' ล.');
  }).catch(errToast);
}
function doCancelReceipt(receiptId) {
  if (!confirm('ลบใบเสร็จ ' + receiptId + ' ?')) return;
  busy(true);
  callServer('cancelReceipt', CURRENT_USER.userId, receiptId, '').then(function () {
    return callServer('receiptsOfOrder', CURRENT_USER.userId, LOAD_ORDER['Order ID']);
  }).then(function (d) { busy(false); renderReceiptList(d); showToast('ลบแล้ว'); }).catch(errToast);
}
function calcLoad() {
  var el = $('load-calc'); if (!el) return;
  var r = RECEIPT_COUNT ? RECEIPT_TOTAL : num($('f-received') && $('f-received').value);
  var c = num($('f-carry') && $('f-carry').value) || 0;
  if (r == null) { el.innerHTML = 'รวมในถังหลังรับ: — (เพิ่มใบเสร็จ หรือกรอกยอดเบิกกรณีไม่มีใบเสร็จ)'; return; }
  el.innerHTML = 'ยกมา ' + c + ' + รับเข้า <span class="big">' + r + '</span>' + (RECEIPT_COUNT ? ' (จาก ' + RECEIPT_COUNT + ' ใบเสร็จ)' : ' (ไม่มีใบเสร็จ)') +
    ' = รวมในถัง <b>' + Math.round((r + c) * 100) / 100 + ' ล.</b>';
}
function doRecordLoad(orderId) {
  var payload = { carryOver: $('f-carry').value, pumpMeterStart: $('f-pumpstart').value };
  if (!RECEIPT_COUNT) {
    var manual = num($('f-received').value);
    if (manual == null || manual <= 0) { showToast('ยังไม่มีใบเสร็จ — เพิ่มใบเสร็จ หรือกรอกยอดเบิกกรณีไม่มีใบเสร็จ'); return; }
    if (!confirm('ไม่มีใบเสร็จเลย จะบันทึกยอดเบิก ' + manual + ' ล. โดยไม่มีหลักฐานจากปั๊มใช่ไหม?')) return;
    payload.received = manual;
  }
  busy(true);
  callServer('recordLoad', CURRENT_USER.userId, orderId, payload).then(function (d) {
    busy(false);
    showToast('บันทึกแล้ว รับเข้า ' + d.received + ' ล.' + (d.receiptCount ? ' (' + d.receiptCount + ' ใบเสร็จ ส่งให้ปั๊มตรวจแล้ว)' : ''));
    renderDriverHome();
  }).catch(errToast);
}

/** แยกค่าในช่องผู้รับ: "รหัส | ชื่อ" (เลือกจากลิสต์) หรือชื่อ/รหัสที่พิมพ์เอง -> {code, name} */
function parseReceiver() {
  var v = $('f-receiver').value.trim();
  if (!v) return { code: '', name: '' };
  var m = v.split(' | ');
  if (m.length === 2) {
    var hit = MASTERS.receivers.filter(function (d) { return d.code === m[0].trim(); })[0];
    if (hit) return { code: hit.code, name: hit.name };
  }
  // พิมพ์เอง: ถ้าตรงรหัสหรือชื่อใน master พอดี ก็ผูกรหัสให้
  var byCode = MASTERS.receivers.filter(function (d) { return d.code === v; })[0];
  if (byCode) return { code: byCode.code, name: byCode.name };
  var byName = MASTERS.receivers.filter(function (d) { return d.name === v; })[0];
  if (byName) return { code: byName.code, name: byName.name };
  return { code: '', name: v }; // ชื่ออิสระ — driver_id จะเป็น NULL ในฐานข้อมูล
}

  if (r.code) { el.textContent = '✓ ' + r.code + ' ' + r.name; el.className = 'hint'; }
  else { el.textContent = 'ไม่พบในรายชื่อ — บันทึกเป็นชื่ออิสระ (ไม่มีรหัสเข้าฐานข้อมูล)'; el.className = 'hint'; }
}

/** ย่อรูปเป็น JPEG base64 (กว้างสุด 1280px) — ลดขนาด payload แบบเดียวกับระบบขอย้ายฯ */
function compressPhoto(file) {
  return new Promise(function (resolve) {
    if (!file) { resolve(null); return; }
    var img = new Image();
    img.onload = function () {
      var maxW = 1280;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', filename: (file.name || 'photo') + '.jpg' });
    };
    img.onerror = function () { resolve(null); };
    img.src = URL.createObjectURL(file);
  });
}

    mileage: $('f-mileage').value, pumpMeterAfter: $('f-pumpafter').value,
    fillDateTime: $('f-datetime').value.trim(), gps: CURRENT_GPS

function money(v) { var n = num(v); return n == null ? '-' : n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function todayDdMmYyyy() {
  var d = new Date();
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
}
function stationTabs(active) {
  return '<div class="tabbar">' +
    ['pending|🧾 รอตรวจ', 'daily|📊 สรุปวัน', 'history|🕘 ประวัติ'].map(function (t) {
      var p = t.split('|');
      return '<button class="' + (active === p[0] ? 'active' : '') + '" onclick="renderStation(\'' + p[0] + '\')">' + p[1] + '</button>';
    }).join('') + '</div>';
}
var STATION_LAST_PRICES = {};
function renderStation(tab) {
  tab = tab || 'pending';

    callServer('stationPending', CURRENT_USER.userId).then(function (d) {

      var groups = {};
      d.receipts.forEach(function (r) { (groups[r['Order ID']] = groups[r['Order ID']] || []).push(r); });
      Object.keys(groups).forEach(function (oid) {
        var rs = groups[oid], first = rs[0];
        var total = rs.reduce(function (t, r) { return t + (num(r['จำนวนลิตร']) || 0); }, 0);

function receiptVerifyCard(r) {

    (mismatch ? ' <span class="status-chip danger">แจ้งไม่ตรงแล้ว รอคนขับแก้</span>' : '') + '</div>' +
    (mismatch && r['หมายเหตุปั๊ม'] ? '<div class="muted">📝 ' + esc(r['หมายเหตุปั๊ม']) + '</div>' : '') +
    '<div class="grid2">' +
    '<div><label>เลขที่ใบเสร็จ</label><input id="vno-' + id + '" value="' + esc(r['เลขที่ใบเสร็จ']) + '" placeholder="ตามสำเนา"></div>' +
    '<div><label>จำนวนลิตร <span class="opt">(คนขับกรอก ' + esc(r['จำนวนลิตร']) + ')</span></label><input id="vl-' + id + '" type="number" inputmode="decimal" value="' + esc(r['จำนวนลิตร']) + '" oninput="calcReceipt(\'' + id + '\')"></div>' +
    '<div><label>ราคาต่อลิตร (บาท)</label><input id="vp-' + id + '" type="number" inputmode="decimal" step="0.01" value="' + esc(price) + '" oninput="calcReceipt(\'' + id + '\')"></div>' +
    '<div><label>จำนวนเงิน (บาท) <span class="opt">คำนวณให้ แก้ได้</span></label><input id="va-' + id + '" type="number" inputmode="decimal" step="0.01"></div>' +
    '</div>' +
    '<label>หมายเหตุ <span class="opt">(ไม่บังคับ / ระบุถ้าไม่ตรง)</span></label><input id="vn-' + id + '">' +
    '<button class="btn-primary btn-small" onclick="doVerifyReceipt(\'' + id + '\', \'OK\')">✅ ตรงสำเนา — บันทึก</button>' +
    '<button class="btn-danger btn-small" onclick="doVerifyReceipt(\'' + id + '\', \'MISMATCH\')">✗ ไม่ตรง แจ้งคนขับ</button>' +
    '</div>';
}
function calcReceipt(id) {
  var l = num($('vl-' + id).value), p = num($('vp-' + id).value);
  if (l != null && p != null) $('va-' + id).value = (Math.round(l * p * 100) / 100).toFixed(2);
}
function doVerifyReceipt(id, result) {
  var patch = {
    result: result, receiptNo: $('vno-' + id).value.trim(), liters: $('vl-' + id).value,
    pricePerLiter: $('vp-' + id).value, amount: $('va-' + id).value, note: $('vn-' + id).value.trim()
  };
  if (result === 'OK') {
    if (num(patch.pricePerLiter) == null || num(patch.pricePerLiter) <= 0) { showToast('ใส่ราคาต่อลิตรก่อน'); return; }
    if (!patch.amount) calcReceipt(id), patch.amount = $('va-' + id).value;
  } else if (!patch.note) {
    patch.note = prompt('ไม่ตรงตรงไหน? (คนขับจะเห็นข้อความนี้)') || '';
    if (!patch.note) return;
  }
  busy(true);
  callServer('verifyReceipt', CURRENT_USER.userId, id, patch)
    .then(function (d) { busy(false); showToast(result === 'OK' ? 'บันทึกแล้ว ' + money(d.amount) + ' บ.' : 'แจ้งคนขับแล้ว'); renderStation('pending'); })
    .catch(errToast);
}
function stationSummaryHtml(sm, withSend) {
  var html = '<div class="card"><h3>📊 สรุปการเติมลงรถน้ำมัน ' + esc(sm.label) + '</h3>' +
    (withSend ? '<div class="row"><label style="display:inline;margin-right:6px">วันที่</label><input id="st-date" value="' + esc(sm.label) + '" placeholder="dd/mm/yyyy" style="width:150px;display:inline-block">' +
      ' <button class="btn-secondary btn-small" onclick="window.STATION_DATE=$(\'st-date\').value.trim();renderStation(\'daily\')">ดู</button></div>' : '') +
    '<div class="calcbox">🚛 รถน้ำมัน <span class="big">' + sm.truckCount + '</span> คัน | 🧾 ' + sm.receiptCount + ' ใบ' +
    '<br>🛢 รวม <span class="big">' + (sm.liters || 0).toLocaleString() + '</span> ลิตร | 💰 <span class="big">' + money(sm.amount) + '</span> บาท' +
    '<br><span class="muted">ตรวจแล้ว ' + sm.verified + ' | รอตรวจ ' + sm.pending + ' | ไม่ตรง ' + sm.mismatch + ' | คีย์ fuel_ap แล้ว ' + sm.apDone + '</span></div>';
  var fuels = Object.keys(sm.byFuel || {});
  if (fuels.length) {
    html += '<div class="tablewrap" style="margin-top:8px"><table><tr><th>ชนิดน้ำมัน</th><th>ใบ</th><th>ลิตร</th><th>บาท</th></tr>' +
      fuels.map(function (f) { var x = sm.byFuel[f]; return '<tr><td>' + esc(f) + '</td><td>' + x.count + '</td><td style="text-align:right">' + x.liters.toLocaleString() + '</td><td style="text-align:right">' + money(x.amount) + '</td></tr>'; }).join('') + '</table></div>';
  }
  var sts = Object.keys(sm.byStation || {});
  if (sts.length > 1) {
    html += '<div class="tablewrap" style="margin-top:8px"><table><tr><th>ปั๊ม</th><th>ใบ</th><th>ลิตร</th><th>บาท</th></tr>' +
      sts.map(function (f) { var x = sm.byStation[f]; return '<tr><td>' + esc(f) + '</td><td>' + x.count + '</td><td style="text-align:right">' + x.liters.toLocaleString() + '</td><td style="text-align:right">' + money(x.amount) + '</td></tr>'; }).join('') + '</table></div>';
  }
  if (sm.receipts && sm.receipts.length) {
    html += '<div class="tablewrap" style="margin-top:8px"><table><tr><th>ใบเสร็จ</th><th>รถ</th><th>ลิตร</th><th>ราคา</th><th>บาท</th><th>สถานะ</th></tr>' +
      sm.receipts.map(function (r) {
        return '<tr><td>' + esc(r['Receipt ID']) + '<br><span class="muted">' + esc(r['เลขที่ใบเสร็จ'] || '-') + '</span></td><td>' + esc(r['รถน้ำมัน']) + '</td>' +
          '<td style="text-align:right">' + esc(r['จำนวนลิตร']) + '</td><td style="text-align:right">' + esc(r['ราคาต่อลิตร'] || '-') + '</td><td style="text-align:right">' + money(r['จำนวนเงิน']) + '</td><td>' + esc(r['สถานะปั๊มตรวจ']) + '</td></tr>';
      }).join('') + '</table></div>';
  }
  if (withSend) html += '<button class="btn-primary" onclick="doSendStationDaily()">📨 ส่งสรุปวันนี้เข้า Telegram สำนักงานใหญ่</button>';
  html += '</div>';
  return html;
}
function doSendStationDaily() {
  var date = $('st-date') ? $('st-date').value.trim() : '';
  busy(true);
  callServer('sendStationDaily', CURRENT_USER.userId, date)
    .then(function () { busy(false); showToast('ส่งสรุปแล้ว'); })
    .catch(errToast);
}

/* ================================ เสมียนปั๊ม 2 (สำนักงานใหญ่ — fuel_ap) ================================ */
function apTabs(active) {
  return '<div class="tabbar">' +
    ['pending|🏢 รอคีย์ fuel_ap', 'monthly|📅 สรุปรายเดือน'].map(function (t) {
      var p = t.split('|');
      return '<button class="' + (active === p[0] ? 'active' : '') + '" onclick="renderAp(\'' + p[0] + '\')">' + p[1] + '</button>';
    }).join('') + '</div>';
}
function renderAp(tab) {
  tab = tab || 'pending';
  busy(true);
  if (tab === 'pending') {
    callServer('apPending', CURRENT_USER.userId).then(function (rows) {
      busy(false);
      var html = apTabs(tab);
      if (!rows.length) { $('main').innerHTML = html + '<div class="empty">ไม่มีใบเสร็จรอคีย์ fuel_ap 🎉</div>'; return; }
      // จัดกลุ่มตามวันที่ + ปั๊ม ให้คีย์เป็นชุดตามที่สำนักงานใหญ่ทำจริง
      var groups = {};
      rows.forEach(function (r) {
        var k = String(r['วันเวลาบันทึก']).slice(0, 10) + ' | ' + r['สถานที่รับน้ำมัน'];
        (groups[k] = groups[k] || []).push(r);
      });
      var failed = rows.filter(function (r) { return r['สถานะ fuel_ap'] === 'นำเข้า fuel_ap ไม่สำเร็จ'; });
      html += '<div class="card"><div class="muted">ระบบนำเข้า materialdb (fuel_po/fuel_ap) ให้อัตโนมัติทุกคืน — รายการด้านล่างคือใบที่ยังไม่ได้นำเข้า' +
        (failed.length ? '<br><b style="color:var(--c-danger)">⚠️ นำเข้าไม่สำเร็จ ' + failed.length + ' ใบ</b> ดูสาเหตุในแถวสีแดง แจ้งเสมียนปั๊ม 1 แก้ราคา/ยอดเงิน แล้วระบบจะลองใหม่คืนถัดไป' : '') + '</div>' +
        '<div class="tablewrap" style="margin-top:8px"><table><tr><th><input type="checkbox" onchange="document.querySelectorAll(\'.ap-cb\').forEach(function(c){c.checked=this.checked},this)"></th>' +
        '<th>วันที่ / ปั๊ม</th><th>ใบเสร็จ</th><th>รถ</th><th>น้ำมัน</th><th>ลิตร</th><th>ราคา</th><th>บาท</th></tr>';
      var total = 0, totalL = 0;
      Object.keys(groups).sort().forEach(function (k) {
        html += '<tr><td colspan="8" style="background:#eef3f0;font-weight:600">' + esc(k) + ' (' + groups[k].length + ' ใบ)</td></tr>';
        groups[k].forEach(function (r) {
          total += num(r['จำนวนเงิน']) || 0; totalL += num(r['จำนวนลิตร']) || 0;
          var isFail = r['สถานะ fuel_ap'] === 'นำเข้า fuel_ap ไม่สำเร็จ';
          html += '<tr' + (isFail ? ' style="background:#fdecea"' : '') + '><td><input type="checkbox" class="ap-cb" value="' + esc(r['Receipt ID']) + '"></td>' +
            '<td>' + esc(r['วันเวลาบันทึก']) + (isFail ? '<br><span style="color:var(--c-danger);font-size:12px">❌ ' + esc(r['ข้อความ error fuel_ap'] || 'นำเข้าไม่สำเร็จ') + '</span>' : '') + '</td>' +
            '<td>' + esc(r['Receipt ID']) + (r['รูปใบเสร็จ'] ? ' <a href="' + esc(r['รูปใบเสร็จ']) + '" target="_blank">📷</a>' : '') + '<br><span class="muted">' + esc(r['เลขที่ใบเสร็จ'] || '-') + '</span></td>' +
            '<td>' + esc(r['รถน้ำมัน']) + '</td><td>' + esc(r['ชนิดน้ำมัน']) + '</td>' +
            '<td style="text-align:right">' + esc(r['จำนวนลิตร']) + '</td><td style="text-align:right">' + esc(r['ราคาต่อลิตร']) + '</td>' +
            '<td style="text-align:right"><b>' + money(r['จำนวนเงิน']) + '</b></td></tr>';
        });
      });
      html += '<tr><td colspan="5" style="text-align:right"><b>รวมค้าง</b></td><td style="text-align:right"><b>' + totalL.toLocaleString() + '</b></td><td></td><td style="text-align:right"><b>' + money(total) + '</b></td></tr></table></div>' +
        '<details style="margin-top:10px"><summary class="muted">คีย์มือแทนระบบ (กรณีพิเศษ)</summary>' +
        '<label>เลขที่เอกสาร fuel_ap <span class="opt">(ไม่บังคับ — ใส่ถ้าคีย์เป็นเอกสารเดียวกัน)</span></label><input id="ap-docno" placeholder="เช่น TA1006900123">' +
        '<button class="btn-secondary" onclick="doMarkAp()">✅ ยืนยันว่าคีย์ fuel_ap แล้ว (ใบที่เลือก)</button></details></div>';
      $('main').innerHTML = html;
    }).catch(errBack);
  } else {
    var ym = window.AP_YM || '';
    callServer('apMonthly', CURRENT_USER.userId, ym).then(function (sm) {
      busy(false);
      var d = new Date();
      var cur = ym || (d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2));
      $('main').innerHTML = apTabs(tab) +
        '<div class="card"><div class="row"><label style="display:inline;margin-right:6px">เดือน (ค.ศ. yyyymm)</label><input id="ap-ym" value="' + esc(cur) + '" style="width:120px;display:inline-block">' +
        ' <button class="btn-secondary btn-small" onclick="window.AP_YM=$(\'ap-ym\').value.trim();renderAp(\'monthly\')">ดู</button></div>' +
        '<div class="muted">ใช้กระทบยอดกับใบวางบิลของปั๊ม — ตัวเลขนับจากใบเสร็จทุกใบในเดือนนั้น (ทุกปั๊ม)</div></div>' +
        stationSummaryHtml(sm, false);
    }).catch(errBack);
  }
}
function doMarkAp() {
  var ids = Array.prototype.slice.call(document.querySelectorAll('.ap-cb:checked')).map(function (c) { return c.value; });
  if (!ids.length) { showToast('เลือกใบเสร็จก่อน'); return; }
  if (!confirm('ยืนยันว่าคีย์ ' + ids.length + ' ใบเข้า fuel_ap แล้ว?')) return;
  busy(true);
  callServer('markApRecorded', CURRENT_USER.userId, ids, $('ap-docno').value.trim())
    .then(function (d) { busy(false); showToast('บันทึกแล้ว ' + d.recorded.length + ' ใบ'); renderAp('pending'); })
    .catch(errToast);
}

/* ================================ Dashboard ================================ */
function renderDashboard() {
  busy(true);
  callServer('dashboard', CURRENT_USER.userId).then(function (d) {
    busy(false);
    var varRows = d.recentVariance.map(function (r) {
      var v = num(r.variance);
      return '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.tank) + '</td>' +
        '<td style="text-align:right">' + esc(r.totalOut) + '</td>' +
        '<td style="text-align:right;' + (v != null && Math.abs(v) > 20 ? 'color:var(--c-danger);font-weight:700' : '') + '">' +
        (v != null && v > 0 ? '+' : '') + esc(r.variance) + '</td></tr>';
    }).join('');
    var flagRows = d.flagged.map(function (f) {
      return '<tr><td>' + esc(f['วันเวลาเติม']) + '</td><td><b>' + esc(f['รหัสเครื่องจักร']) + '</b></td>' +
        '<td style="text-align:right">' + esc(f['จำนวนลิตร']) + '</td><td>' + flagsHtml(f['ธงเตือน']) + '</td></tr>';
    }).join('');
    $('main').innerHTML =
      '<div class="card"><h3>📊 วันนี้ (' + esc(d.today) + ')</h3>' +
      '<div class="row">จ่ายแล้ว <b>' + d.todayLiters + ' ลิตร</b> | ' + d.todayFillCount + ' รายการ | ' + d.todayMachineCount + ' คัน</div></div>' +
      '<div class="card"><h3>⚖️ ผลต่างถังรายวัน (ล่าสุด)</h3><div class="tablewrap"><table>' +
      '<tr><th>ปิดวัน</th><th>รถน้ำมัน</th><th>จ่าย (ล.)</th><th>ต่าง (ล.)</th></tr>' +
      (varRows || '<tr><td colspan="4" class="empty">ยังไม่มีข้อมูล</td></tr>') + '</table></div></div>' +
      '<div class="card"><h3>🚩 รายการติดธงล่าสุด</h3><div class="tablewrap"><table>' +
      '<tr><th>เวลา</th><th>เครื่องจักร</th><th>ลิตร</th><th>ธง</th></tr>' +
      (flagRows || '<tr><td colspan="4" class="empty">ไม่มีรายการติดธง 🎉</td></tr>') + '</table></div></div>';
  }).catch(errBack);
}

/* ================================ error helpers ================================ */
function errToast(err) { busy(false); showToast('❌ ' + err.message); }
function errBack(err) {
  busy(false);
  $('main').innerHTML = '<div class="card"><h3>โหลดข้อมูลไม่สำเร็จ</h3><div class="muted">' + esc(err.message) + '</div>' +
    '<button class="btn-secondary" onclick="location.reload()">โหลดใหม่</button></div>';
}

comboInit_();
init();
</script>
</body>
</html>
